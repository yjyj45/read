<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>딸기반 독서기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one rounded pink card with a strawberry header and a 5×5 grid of strawberry-milk number tiles */
  :root {
    --bg: #fff0f4;
    --dots: #ffd9e3;
    --paper: #ffffff;
    --ink: #5a2236;
    --muted: #a0566f;
    --tile: #ff7a9c;
    --tile-ink: #ffffff;
    --tile-hover: #ff5f88;
    --tile-shadow: #e0507a;
    --line: #ffd0dc;
    --berry: #f0405f;
    --berry-dark: #c92a49;
    --leaf: #4fb36b;
    --seed: #ffe58a;
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a1820; --dots: #3a2230; --paper: #34202a; --ink: #ffe3ec; --muted: #e7a3ba;
      --tile: #e85a80; --tile-ink: #ffffff; --tile-hover: #f2709250; --tile-shadow: #a8304f;
      --line: #4e2d3b; --berry: #f0405f; --berry-dark: #c92a49; --leaf: #5cc078; --seed: #ffe58a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a1820; --dots: #3a2230; --paper: #34202a; --ink: #ffe3ec; --muted: #e7a3ba;
    --tile: #e85a80; --tile-ink: #ffffff; --tile-hover: #f27092; --tile-shadow: #a8304f;
    --line: #4e2d3b; --berry: #f0405f; --berry-dark: #c92a49; --leaf: #5cc078; --seed: #ffe58a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --tile-hover: #f27092; }
  }
  html, body { min-height: 100%; }
  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dots) 2.5px, transparent 3px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 28px;
    padding: clamp(16px, 4vw, 28px);
    display: grid;
    gap: 16px;
  }
  header { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .berry-big { width: clamp(40px, 10vw, 56px); height: auto; margin-bottom: 2px; }
  .berry-big { animation: bob 2.8s ease-in-out infinite; transform-origin: 50% 20%; }
  @keyframes bob { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .sub {
    font-family: var(--font-display);
    font-size: clamp(1.25rem, 4.6vw, 1.65rem);
    color: var(--muted);
    margin: 0;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 8.5vw, 3rem);
    line-height: 1.15;
    color: var(--berry);
    margin: 0;
    text-wrap: balance;
  }
  .hint { margin: 4px 0 0; color: var(--muted); font-size: 1rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(8px, 2vw, 12px);
    list-style: none;
    width: min(100%, 460px, max(240px, calc(100dvh - 330px)));
    margin: 0 auto;
    padding: 0;
  }
  .grid a {
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    max-width: 100%;
    background-color: var(--tile);
    background-image:
      radial-gradient(ellipse 3px 4px at 24% 34%, var(--seed) 85%, transparent),
      radial-gradient(ellipse 3px 4px at 77% 30%, var(--seed) 85%, transparent),
      radial-gradient(ellipse 3px 4px at 18% 64%, var(--seed) 85%, transparent),
      radial-gradient(ellipse 3px 4px at 82% 62%, var(--seed) 85%, transparent),
      radial-gradient(ellipse 3px 4px at 50% 87%, var(--seed) 85%, transparent);
    color: var(--tile-ink);
    border-radius: 45% 45% 40% 40% / 42% 42% 48% 48%;
    text-decoration: none;
    font-family: var(--font-display);
    font-size: clamp(1.1rem, min(5.6vw, 4.2dvh), 1.9rem);
    font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 0 var(--tile-shadow);
    transition: background .15s, transform .1s;
  }
  .grid a::before {
    content: "";
    position: absolute;
    top: -6%;
    left: 50%;
    width: 34%;
    height: 18%;
    transform: translateX(-50%);
    background: var(--leaf);
    border-radius: 50% 50% 40% 40%;
    clip-path: polygon(0 0, 25% 60%, 50% 0, 75% 60%, 100% 0, 100% 100%, 0 100%);
  }
  .grid a:hover { background-color: var(--tile-hover); }
  .grid a:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tile-shadow); }
  .grid a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  footer {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--muted); font-size: .95rem;
  }
  footer svg { width: 18px; height: auto; }
  @media (prefers-reduced-motion: reduce) {
    .grid a { transition: none; }
    .berry-big { animation: none; }
  }
</style>
</head>
